<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>לוח זמנים</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800&display=swap');

  :root{
    --bg:#0d1220; --bg-2:#0a0e18;
    --panel:#151d2b; --panel-2:#1b2536;
    --ink:#f5efe2; --muted:#98a6bd;
    --gold:#d9a441; --gold-bright:#eec06a; --gold-soft:rgba(217,164,65,.14);
    --ivory:#f5ecd9; --ivory-ink:#2b2418;
    --line:rgba(245,239,226,.10); --line-gold:rgba(217,164,65,.38);
    --shabbat:#8ab6e6; --shabbat-soft:rgba(138,182,230,.13);
    --yomtov:#7fcf95; --yomtov-soft:rgba(127,207,149,.13);
    --serif:'Frank Ruhl Libre','Times New Roman',serif;
    --sans:'Heebo',system-ui,sans-serif;
    --overscan:0px;
  }

  html,body{height:100%;overflow:hidden;}
  body{
    margin:0; color:var(--ink); font-family:var(--sans); direction:rtl;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(55% 45% at 100% 0%, rgba(217,164,65,.10), transparent 60%),
      radial-gradient(50% 42% at 0% 0%, rgba(138,182,230,.09), transparent 60%),
      radial-gradient(130% 100% at 50% -10%, #17223a 0%, var(--bg) 48%, var(--bg-2) 100%);
  }
  *{box-sizing:border-box;}

  .board{
    position:fixed; inset:var(--overscan);
    display:grid; grid-template-rows:auto auto 1fr; gap:clamp(10px,1.5vh,22px);
    padding:clamp(14px,2.2vh,30px) clamp(16px,2.2vw,40px);
    overflow:hidden;
  }

  /* ---------------- Header ---------------- */
  header{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:clamp(10px,2vw,36px);
    padding-bottom:clamp(8px,1.2vh,16px); border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:clamp(8px,1vw,16px);}
  .brand-logo{height:clamp(44px,5.5vw,80px);width:auto;flex:none;border-radius:12px;background:#fff;padding:clamp(3px,.5vw,6px);}
  .shul-name{font-family:var(--serif);font-weight:900;font-size:clamp(1.3rem,2.7vw,2.9rem);line-height:1.05;}
  .shul-sub{color:var(--muted);font-weight:500;font-size:clamp(.72rem,1vw,1.05rem);margin-top:.25em;}
  .center{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.6vh,8px);}
  .clock-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.5vw,24px);}
  .dash{height:2px;width:clamp(24px,3.6vw,80px);border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold));opacity:.75;}
  .clock-wrap .dash:last-child{background:linear-gradient(90deg,var(--gold),transparent);}
  .clock{font-family:var(--sans);font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(2.4rem,6vw,6.6rem);line-height:.9;color:var(--gold-bright);text-shadow:0 0 34px rgba(217,164,65,.28);}
  .tagline{font-family:var(--serif);color:var(--muted);font-size:clamp(.72rem,1.1vw,1.2rem);letter-spacing:.05em;text-align:center;}
  .dates{justify-self:start;text-align:start;}
  .hebrew-date{font-family:var(--serif);font-weight:700;font-size:clamp(1.05rem,2.1vw,2.2rem);line-height:1.1;}
  .greg-date{color:var(--muted);font-weight:500;font-size:clamp(.72rem,1vw,1.05rem);margin-top:.25em;direction:rtl;}

  /* ---------------- Parsha ribbon ---------------- */
  .ribbon{
    display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.5vw,24px);flex-wrap:wrap;
    padding:clamp(6px,1vh,14px) clamp(14px,2vw,28px);
    background:var(--gold-soft);border:1px solid var(--line-gold);border-radius:14px;
  }
  .ribbon .orn{flex:none;width:clamp(20px,2.6vw,40px);color:var(--gold);opacity:.65;}
  .ribbon .orn-flip{transform:scaleX(-1);}
  .ribbon .lead{color:var(--muted);font-weight:500;font-size:clamp(.78rem,1.1vw,1.2rem);letter-spacing:.12em;}
  .ribbon .parsha{font-family:var(--serif);font-weight:700;color:var(--gold-bright);font-size:clamp(1.1rem,2.3vw,2.3rem);}
  .ribbon .tag{font-weight:700;background:rgba(245,239,226,.08);border:1px solid var(--line);padding:.2em .8em;border-radius:999px;font-size:clamp(.82rem,1.2vw,1.3rem);}
  .ribbon .tag[hidden]{display:none;}

  /* ---------------- Stage / screens (crossfade) ---------------- */
  .stage{position:relative;min-height:0;}
  .screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s ease;pointer-events:none;
    display:flex;flex-direction:column;gap:clamp(10px,1.4vw,22px);}
  .screen.active{opacity:1;visibility:visible;}
  @media (prefers-reduced-motion:reduce){ .screen{transition:none;} }
  /* a row of cards that share the width; hidden cards collapse and the rest re-fill */
  .card-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(10px,1.4vw,22px);flex:1;min-height:0;}
  .screen > .next-card{flex:0 0 auto;}      /* shabbat hero: size to content, list below fills */
  [hidden]{display:none!important;}

  /* ---------------- Cards ---------------- */
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:18px;
    padding:clamp(12px,1.5vh,24px) clamp(14px,1.5vw,26px);
    display:flex;flex-direction:column;min-height:0;box-shadow:0 16px 36px rgba(0,0,0,.30);
  }
  .card--ivory{background:linear-gradient(180deg,#f7f1e4,#efe4d0);color:var(--ivory-ink);border-color:var(--line-gold);}
  .card--ivory .card-note,.card--ivory .muted{color:#6b5c3f;}
  .card--gold{background:linear-gradient(180deg,#2a2440,#20233a);border-color:var(--line-gold);}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:.6em;
    padding-bottom:clamp(6px,1vh,14px);margin-bottom:clamp(6px,1vh,12px);border-bottom:2px solid var(--line-gold);}
  .card-title{font-family:var(--serif);font-weight:900;font-size:clamp(1.15rem,2vw,2rem);color:var(--gold);}
  .card--ivory .card-title{color:#9a6b18;}
  .card-note{color:var(--muted);font-weight:500;font-size:clamp(.7rem,.95vw,1rem);}
  .card-icon{flex:none;display:grid;place-items:center;width:clamp(32px,3.2vw,50px);height:clamp(32px,3.2vw,50px);
    border-radius:50%;color:var(--gold);background:radial-gradient(circle at 32% 28%,var(--gold-soft),rgba(217,164,65,.04));border:1.5px solid var(--line-gold);}
  .card-icon svg{width:56%;height:56%;}
  .card--ivory .card-icon{color:#9a6b18;background:rgba(154,107,24,.10);border-color:rgba(154,107,24,.35);}

  /* rows list */
  .rows{--rs:1;display:flex;flex-direction:column;justify-content:flex-start;flex:1;gap:calc(clamp(1px,.4vh,6px)*var(--rs));min-height:0;overflow:hidden;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:.8em;padding:calc(clamp(2px,.5vh,8px)*var(--rs)) 0;}
  .row + .row{border-top:1px dotted var(--line);}
  .card--ivory .row + .row{border-top-color:rgba(154,107,24,.22);}
  .row .name{font-weight:500;font-size:calc(clamp(1rem,1.5vw,1.7rem)*var(--rs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .name .hint{color:var(--muted);font-size:.7em;margin-inline-start:.4em;}
  .card--ivory .row .name .hint{color:#7a6a48;}
  .row .val{font-weight:800;font-variant-numeric:tabular-nums;font-size:calc(clamp(1.05rem,1.7vw,1.85rem)*var(--rs));color:var(--gold-bright);direction:ltr;}
  .card--ivory .row .val{color:#9a6b18;}
  .row--big .val{font-size:calc(clamp(1.2rem,2vw,2.1rem)*var(--rs));}
  .row.past{opacity:.4;}

  /* next-event hero card */
  .next-card{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(4px,1vh,14px);}
  .next-card .ne-label{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:clamp(1rem,1.7vw,1.7rem);}
  .next-card .ne-name{font-family:var(--serif);font-weight:900;font-size:clamp(1.6rem,3.4vw,3.6rem);line-height:1.05;}
  .next-card .ne-time{font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(2.6rem,6vw,6rem);line-height:.95;color:var(--gold-bright);text-shadow:0 0 30px rgba(217,164,65,.25);direction:ltr;}
  .next-card .ne-count{color:var(--muted);font-size:clamp(.85rem,1.3vw,1.4rem);font-weight:600;}

  /* section list (shabbat columns) */
  .section-title{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:clamp(1rem,1.6vw,1.7rem);
    display:flex;align-items:center;gap:.4em;margin-bottom:.3em;}
  .panel--shabbat .card-title,.panel--shabbat .section-title{color:var(--shabbat);}
  .panel--shabbat .row .val{color:var(--shabbat);}
  .panel--shabbat .card-head{border-bottom-color:rgba(138,182,230,.4);}
  .panel--shabbat .card-icon{color:var(--shabbat);border-color:rgba(138,182,230,.4);background:radial-gradient(circle at 32% 28%,var(--shabbat-soft),transparent);}
  .panel--yomtov .card-title,.panel--yomtov .section-title{color:var(--yomtov);}
  .panel--yomtov .row .val{color:var(--yomtov);}
  .panel--yomtov .card-icon{color:var(--yomtov);border-color:rgba(127,207,149,.4);}

  /* bulleted community lists */
  .bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(4px,.9vh,12px);}
  .bullets li{font-size:clamp(1rem,1.5vw,1.6rem);line-height:1.35;padding-inline-start:1em;position:relative;}
  .bullets li::before{content:"•";color:var(--gold);position:absolute;inset-inline-start:0;}
  .dvar{--ds:1;flex:1;min-height:0;overflow:hidden;font-family:var(--serif);font-size:calc(clamp(1.05rem,1.85vw,2rem)*var(--ds));line-height:1.5;text-align:start;}
  .dvar b{color:#9a6b18;font-weight:800;}
  .dvar .src{display:block;color:var(--muted);font-size:.6em;margin-top:.7em;text-align:center;}

  /* bottom rotating message */
  .ticker{grid-column:1 / -1;text-align:center;color:var(--muted);font-family:var(--serif);
    font-size:clamp(.85rem,1.4vw,1.5rem);padding-top:.2em;border-top:1px solid var(--line);}
  .ticker b{color:var(--gold);font-weight:700;}

  @media (max-width:820px){
    header{grid-template-columns:1fr;justify-items:center;text-align:center;gap:8px;}
    .dates{justify-self:center;text-align:center;}
    .grid-3,.grid-shabbat,.grid-comm{grid-template-columns:1fr;grid-auto-rows:minmax(0,auto);}
  }
</style>

<body>

<div class="board">
  <header>
    <div class="brand">
      <img class="brand-logo" alt="" src="logo.jpg">
      <div class="brand-text">
        <div class="shul-name" id="shulName">בית הכנסת</div>
        <div class="shul-sub" id="shulSub"></div>
      </div>
    </div>
    <div class="center">
      <div class="clock-wrap"><span class="dash"></span><div class="clock" id="clock">--:--</div><span class="dash"></span></div>
      <div class="tagline">זמן לתפילה · זמן לחיים טובים יותר</div>
    </div>
    <div class="dates">
      <div class="hebrew-date" id="hebrewDate">—</div>
      <div class="greg-date" id="gregDate">—</div>
    </div>
  </header>

  <div class="ribbon">
    <svg class="orn" viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12H30M30 12q4-7 8-9q-2 5-8 9q6 4 8 9q-4-2-8-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span class="lead">פרשת השבוע</span>
    <span class="parsha" id="parsha">—</span>
    <span class="tag" id="specialDay" hidden></span>
    <svg class="orn orn-flip" viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12H30M30 12q4-7 8-9q-2 5-8 9q6 4 8 9q-4-2-8-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </div>

  <div class="stage">
    <!-- ===== Screen 1: TODAY / NOW ===== -->
    <section class="screen" id="screen-today">
      <div class="card-row">
        <div class="card card--gold next-card" id="nextPrayer"></div>
        <div class="card">
          <div class="card-head"><span class="card-title">זמני היום</span>
            <span class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2.5V4.8"/><path d="M12 19.2V21.5"/><path d="M2.5 12H4.8"/><path d="M19.2 12H21.5"/><path d="M5.2 5.2 6.8 6.8"/><path d="M17.2 17.2 18.8 18.8"/><path d="M18.8 5.2 17.2 6.8"/><path d="M6.8 17.2 5.2 18.8"/></g></svg></span></div>
          <div class="rows" id="todayZmanim"></div>
        </div>
        <div class="card card--ivory" id="nextShiurCard">
          <div class="card-head"><span class="card-title">השיעור הבא</span>
            <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 5.5C10 4 6.2 4 4 5V19c2.2-1 6-1 8 .5 2-1.5 5.8-1.5 8-.5V5c-2.2-1-6-1-8 .5Zm0 0V19.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></div>
          <div class="rows" id="nextShiur"></div>
        </div>
      </div>
      <div class="ticker" id="ticker"></div>
    </section>

    <!-- ===== Screen 2: TEFILLOT & SHIURIM ===== -->
    <section class="screen" id="screen-tefillot">
      <div class="card-row">
        <div class="card" id="tefTefCard">
          <div class="card-head"><span class="card-title">תפילות היום</span>
            <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 3v8m0 0c-3 0-5 2-5 5v2h10v-2c0-3-2-5-5-5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span></div>
          <div class="rows" id="tefRows"></div>
        </div>
        <div class="card" id="tefShiurCard">
          <div class="card-head"><span class="card-title">שיעורים</span>
            <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 5.5C10 4 6.2 4 4 5V19c2.2-1 6-1 8 .5 2-1.5 5.8-1.5 8-.5V5c-2.2-1-6-1-8 .5Zm0 0V19.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></div>
          <div class="rows" id="shiurRows"></div>
        </div>
        <div class="card card--ivory" id="tefDvarCard">
          <div class="card-head"><span class="card-title">דבר תורה</span></div>
          <div class="dvar" id="tefDvar"></div>
        </div>
      </div>
      <div class="card" id="tefAnnounceCard">
        <div class="card-head"><span class="card-title">הודעות</span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 11l14-6v14L4 13Zm0 0v4m4-2v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span></div>
        <ul class="bullets" id="tefAnnounce"></ul>
      </div>
    </section>

    <!-- ===== Screen 3: SHABBAT KODESH ===== -->
    <section class="screen panel--shabbat" id="screen-shabbat">
      <div class="card card--gold next-card" id="shabbatNext"></div>
      <div class="card-row">
        <div class="card"><div class="card-head"><span class="card-title" id="secErevTitle">ערב שבת</span></div><div class="rows" id="shErev"></div></div>
        <div class="card"><div class="card-head"><span class="card-title">שבת בבוקר</span></div><div class="rows" id="shMorning"></div></div>
        <div class="card"><div class="card-head"><span class="card-title">שבת אחר הצהריים</span></div><div class="rows" id="shAfternoon"></div></div>
      </div>
    </section>

    <!-- ===== Screen 4: COMMUNITY / TORAH ===== -->
    <section class="screen" id="screen-community">
      <div class="card-row">
        <div class="card" id="commAnnCard">
          <div class="card-head"><span class="card-title">הודעות</span>
            <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 11l14-6v14L4 13Zm0 0v4m4-2v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span></div>
          <ul class="bullets" id="commAnnounce"></ul>
        </div>
        <div class="card" id="commMazalCard">
          <div class="card-head"><span class="card-title">מזל טוב</span></div>
          <ul class="bullets" id="commMazal"></ul>
        </div>
        <div class="card card--ivory" id="commDvarCard">
          <div class="card-head"><span class="card-title">דבר תורה</span></div>
          <div class="dvar" id="commDvar"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/kosher-zmanim@0.9.0/dist/kosher-zmanim.min.js"></script>
<script>
(function(){
  const KZ = window.KosherZmanim;
  const $ = id => document.getElementById(id);
  const setHidden = (id,cond)=>{ const e=$(id); if(e) e.hidden=!!cond; };

  $("shulName").textContent = CONFIG.shulName;
  $("shulSub").textContent  = CONFIG.shulSub;
  document.documentElement.style.setProperty("--overscan", (Number(CONFIG.overscanPercent)||0)+"%");

  /* ---------- date helpers ---------- */
  function toDate(x){ if(!x) return null; if(x instanceof Date) return x;
    if(typeof x.toJSDate==="function") return x.toJSDate();
    if(typeof x.epochMilliseconds==="number") return new Date(x.epochMilliseconds);
    const d=new Date(x); return isNaN(d)?null:d; }
  function plainDate(d){ const T=KZ.Temporal;
    return (T&&T.PlainDate)?T.PlainDate.from({year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()}):d; }
  const fmtTime = d => d ? new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:CONFIG.timeZone}).format(d) : "—";

  function calFor(d){
    const geo=new KZ.GeoLocation(CONFIG.locationName,CONFIG.latitude,CONFIG.longitude,CONFIG.elevation,CONFIG.timeZone);
    const c=new KZ.ComplexZmanimCalendar(geo);
    try{ c.setUseElevation(false); }catch(_){}
    try{ c.setDate(plainDate(d)); }catch(e){ try{c.setDate(d);}catch(_){} }
    return c;
  }
  function jewishCalFor(d){ let jc; try{jc=new KZ.JewishCalendar(plainDate(d));}catch(e){try{jc=new KZ.JewishCalendar(d);}catch(_){jc=new KZ.JewishCalendar();}}
    try{jc.setInIsrael(true);}catch(_){} return jc; }
  const safe = fn => { try{ return toDate(fn()); }catch(e){ return null; } };

  /* ---------- times sheet ---------- */
  let SHEET=null;
  const hebNorm = s => (s||"").replace(/[^א-ת]/g,"");
  function hebKeyFor(d){ try{ const hdf=new KZ.HebrewDateFormatter(); hdf.setHebrewFormat(true);
    const t=hdf.format(jewishCalFor(d)).trim().split(/\s+/); t.pop(); return hebNorm(t.join("")); }catch(e){ return ""; } }
  function parseCSV(txt){ const rows=[]; let f=[],cur="",q=false;
    for(let i=0;i<txt.length;i++){ const c=txt[i];
      if(q){ if(c=='"'){ if(txt[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c=='"')q=true; else if(c==','){f.push(cur);cur="";}
        else if(c=='\n'||c=='\r'){ if(c=='\r'&&txt[i+1]=='\n')i++; f.push(cur); rows.push(f); f=[]; cur=""; } else cur+=c; } }
    if(cur.length||f.length){ f.push(cur); rows.push(f); } return rows; }
  const DATA={ shiurim:null, dvar:null, announce:null, mazal:null };  // null = use CONFIG fallback
  async function fetchRows(url){
    if(!url) return null;
    try{ const bust=(url.indexOf("?")>=0?"&":"?")+"_="+Date.now();
      return parseCSV(await (await fetch(url+bust,{cache:"no-store"})).text()); }
    catch(e){ return null; }
  }
  function notExpired(until){ until=(until||"").trim(); if(!until) return true;
    const t=Date.parse(until); if(isNaN(t)) return true;
    const today=new Date(); today.setHours(0,0,0,0); return t>=today.getTime(); }

  async function loadAll(){
    const [t,sh,dv,an,mz]=await Promise.all([
      fetchRows(CONFIG.timesSheetCsvUrl), fetchRows(CONFIG.shiurimSheetUrl),
      fetchRows(CONFIG.dvarTorahSheetUrl), fetchRows(CONFIG.announcementsSheetUrl),
      fetchRows(CONFIG.mazalTovSheetUrl),
    ]);
    // times
    if(t){ const m=new Map();
      t.slice(1).forEach(r=>{ const k=hebNorm(r[2]); if(!k) return;
        m.set(k,{ name:(r[0]||"").trim(), candle:(r[3]||"").trim(), shkia:(r[5]||"").trim(), motzaei:(r[9]||"").trim() }); });
      SHEET=m.size?m:null;
    } else SHEET=null;
    // shiurim: name | time | day
    DATA.shiurim = sh ? sh.slice(1).map(r=>({name:(r[0]||"").trim(),time:(r[1]||"").trim(),day:(r[2]||"").trim()})).filter(x=>x.name) : null;
    // dvar torah: text | source
    DATA.dvar = dv ? dv.slice(1).map(r=>({text:(r[0]||"").trim(),source:(r[1]||"").trim()})).filter(x=>x.text) : null;
    // announcements: text | until
    DATA.announce = an ? an.slice(1).map(r=>({text:(r[0]||"").trim(),until:(r[1]||"").trim()})).filter(x=>x.text&&notExpired(x.until)).map(x=>x.text) : null;
    // mazal tov: text | until
    DATA.mazal = mz ? mz.slice(1).map(r=>({text:(r[0]||"").trim(),until:(r[1]||"").trim()})).filter(x=>x.text&&notExpired(x.until)).map(x=>x.text) : null;
  }

  // content getters — live sheet data when present, else CONFIG placeholders
  const getShiurim = () => DATA.shiurim || CONFIG.shiurim || [];
  const getAnnouncements = () => DATA.announce || CONFIG.announcements || [];
  const getMazal = () => DATA.mazal || CONFIG.mazalTov || [];
  function getDvar(now){
    if(DATA.dvar && DATA.dvar.length){
      const start=new Date(now.getFullYear(),0,0);
      const doy=Math.floor((now-start)/86400000);       // day-of-year → rotates daily
      return DATA.dvar[doy % DATA.dvar.length];
    }
    return CONFIG.dvarTorah || null;
  }
  function dvarHtml(dv){
    if(!dv||!dv.text) return "";
    let t=String(dv.text).trim().replace(/[ \t]{2,}/g," ");  // drop stray extra spaces
    t=t.replace(/\r\n|\r|\n/g,"<br>");                       // honor sheet line breaks
    t=t.replace(/(^|<br>)\s*(השאלה:)/,'$1<b>$2</b> ');       // bold "השאלה:"
    t=t.replace(/\s*(התשובה:)/,'<br><b>$1</b> ');            // answer on next line, bold
    return `<div class="dvar-text">${t}</div>${dv.source?`<span class="src">${dv.source}</span>`:""}`;
  }
  const DAYNAMES={'א':'ראשון','ב':'שני','ג':'שלישי','ד':'רביעי','ה':'חמישי','ו':'שישי','ז':'שבת','ש':'שבת'};
  function dayLabel(d){ d=(d||"").trim(); if(!d) return "";
    const c=d.replace(/[׳'"]/g,"");
    if(/^[א-ז]$/.test(c)) return "יום "+DAYNAMES[c];
    const m=/^([א-ז])\s*[-–]\s*([א-ז])$/.exec(c);
    if(m) return "ימים "+DAYNAMES[m[1]]+"–"+DAYNAMES[m[2]];
    return d;   // already descriptive (כל יום / לאחר ערבית …)
  }
  function nextDow(base,dow){ const d=new Date(base.getFullYear(),base.getMonth(),base.getDate());
    d.setDate(d.getDate()+((dow-d.getDay()+7)%7)); return d; }
  function nextEventRow(now){ if(!SHEET) return null;
    const s=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    for(let i=0;i<40;i++){ const d=new Date(s); d.setDate(s.getDate()+i);
      const row=SHEET.get(hebKeyFor(d)); if(row) return {date:d,row,isShabbat:d.getDay()===6}; }
    return null; }

  /* ---------- time / event utilities ---------- */
  function toToday(now,hhmm){ const m=/^(\d{1,2}):(\d{2})$/.exec((hhmm||"").trim()); if(!m) return null;
    return new Date(now.getFullYear(),now.getMonth(),now.getDate(),+m[1],+m[2],0); }
  function countdownText(t,now){ if(!t) return ""; const diff=t-now; if(diff<0) return "";
    const mins=Math.round(diff/60000); if(mins<1) return "מתחילה כעת";
    if(mins>(Number(CONFIG.reduceCountdownUnder)||120)) return "";
    if(mins<60) return "מתחילה בעוד "+mins+" דקות";
    return "מתחילה בעוד "+Math.floor(mins/60)+" שע׳ "+(mins%60)+" דק׳"; }
  function nextUpcoming(now,list){ let best=null;
    (list||[]).forEach(it=>{ const t=toToday(now,it.time); if(t&&t>=now&&(!best||t<best.t)) best={name:it.name,time:it.time,t,day:it.day}; });
    return best; }

  /* ---------- rows renderer + auto-fit ---------- */
  function renderRows(el,items){ if(!el) return; el.innerHTML="";
    (items||[]).filter(it=>it&&(it.val||it.val==="")).forEach(it=>{
      const row=document.createElement("div");
      row.className="row"+(it.big?" row--big":"")+(it.past?" past":"");
      row.innerHTML=`<span class="name">${it.name}${it.hint?`<span class="hint">${it.hint}</span>`:""}</span><span class="val">${it.val||""}</span>`;
      el.appendChild(row); }); }
  function fitScale(el,v){ if(!el) return; el.style.setProperty(v,"1"); if(el.clientHeight===0) return;
    let rs=1,g=0; while(el.scrollHeight>el.clientHeight+1&&rs>0.4&&g<28){ rs-=0.05; el.style.setProperty(v,rs.toFixed(2)); g++; } }
  function fitActive(){ const s=document.querySelector(".screen.active"); if(!s) return;
    s.querySelectorAll(".rows").forEach(el=>fitScale(el,"--rs"));
    s.querySelectorAll(".dvar").forEach(el=>fitScale(el,"--ds")); }

  /* ---------- header (shared) ---------- */
  function renderHeader(now){
    $("clock").textContent=new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:CONFIG.timeZone}).format(now);
    $("gregDate").textContent=new Intl.DateTimeFormat("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:CONFIG.timeZone}).format(now);
    try{ const hdf=new KZ.HebrewDateFormatter(); hdf.setHebrewFormat(true);
      $("hebrewDate").textContent=hdf.format(jewishCalFor(now));
      const row=nextEventRow(now);
      const p=(row&&row.name)?row.name:hdf.formatParsha(jewishCalFor(nextDow(now,6)));
      $("parsha").textContent=p&&p.length?p:"—";
      let special=""; try{ if(typeof (jewishCalFor(now)).isRoshChodesh==="function"&&jewishCalFor(now).isRoshChodesh()) special="ראש חודש";
        const yt=hdf.formatYomTov?hdf.formatYomTov(jewishCalFor(now)):""; if(yt) special=yt; }catch(e){}
      const el=$("specialDay"); if(special){el.textContent=special;el.hidden=false;} else el.hidden=true;
    }catch(e){ $("hebrewDate").textContent="—"; }
  }

  /* ---------- zmanim (Siddur opinions, sea-level) ---------- */
  function dailyZmanim(now){
    const c=calFor(now);
    const chatz=safe(()=>c.getChatzos());
    const seaSunset=safe(()=>c.getSeaLevelSunset());
    const tzeis23=seaSunset?new Date(seaSunset.getTime()+23*60000):null;
    let halfGra=null; try{halfGra=c.getShaahZmanisGra()/2;}catch(_){}
    const mgOffset=(halfGra!=null)?Math.max(halfGra,30*60000):30*60000;
    const minchaGed=chatz?new Date(chatz.getTime()+mgOffset):null;
    const items=[
      {key:"alos",name:"עלות השחר",val:fmtTime(safe(()=>c.getAlos72()))},
      {key:"netz",name:"הנץ החמה",val:fmtTime(safe(()=>c.getSeaLevelSunrise()))},
      {key:"shmaMGA",name:'סוף זמן ק"ש',hint:'מג"א',val:fmtTime(safe(()=>c.getSofZmanShmaMGA72Minutes()))},
      {key:"shmaGRA",name:'סוף זמן ק"ש',hint:'הגר"א',val:fmtTime(safe(()=>c.getSofZmanShmaGRA()))},
      {key:"tfilaGRA",name:"סוף זמן תפילה",hint:'הגר"א',val:fmtTime(safe(()=>c.getSofZmanTfilaGRA()))},
      {key:"chatzos",name:"חצות היום",val:fmtTime(chatz)},
      {key:"minchaGedola",name:"מנחה גדולה",val:fmtTime(minchaGed)},
      {key:"minchaKetana",name:"מנחה קטנה",val:fmtTime(safe(()=>c.getMinchaKetana()))},
      {key:"plag",name:"פלג המנחה",val:fmtTime(safe(()=>c.getPlagHamincha()))},
      {key:"shkia",name:"שקיעת החמה",val:fmtTime(seaSunset)},
      {key:"tzais",name:"צאת הכוכבים",val:fmtTime(tzeis23)},
    ];
    const ov=CONFIG.zmanimOverrides||{};
    let out=items.filter(it=>ov[it.key]!==false).map(it=>ov[it.key]?{...it,val:ov[it.key]}:it);
    (CONFIG.extraDayRows||[]).forEach(r=>{ if(r&&r.name) out.push({name:r.name,hint:r.hint,val:r.time}); });
    return out;
  }

  /* ---------- Shabbat data (sections + candle/motzaei from sheet) ---------- */
  function shabbatData(now){
    const ev=nextEventRow(now);
    const isShabbat=ev?ev.isShabbat:true;
    const evDate=ev?ev.date:nextDow(now,6);
    const row=ev?ev.row:null;
    const eve=new Date(evDate.getFullYear(),evDate.getMonth(),evDate.getDate()-1);
    const cEve=calFor(eve), cDay=calFor(evDate);
    let candle=safe(()=>cEve.getSunset()); if(candle) candle=new Date(candle.getTime()-CONFIG.candleOffsetMinutes*60000);
    const daySunset=safe(()=>cDay.getSunset());
    const candleVal=(row&&row.candle)?row.candle:fmtTime(candle);
    const shkiaVal=(row&&row.shkia)?row.shkia:fmtTime(safe(()=>cEve.getSunset()));
    const motzaeiVal=(row&&row.motzaei)?row.motzaei:(daySunset?fmtTime(new Date(daySunset.getTime()+31*60000)):"—");
    const rtVal=daySunset?fmtTime(new Date(daySunset.getTime()+72*60000)):"—";
    const s=CONFIG.shabbat||{};
    const erev=[...(s.erev||[]),{name:"הדלקת נרות",val:candleVal,big:true},{name:"שקיעה",val:shkiaVal}];
    const morning=[...(s.morning||[])];
    const afternoon=[...(s.afternoon||[]),{name:"מוצאי שבת",val:motzaeiVal,big:true},{name:'ר"ת',val:rtVal}];
    // normalize {name,time}->{name,val}
    const norm=a=>a.map(x=>x.val!==undefined?x:{name:x.name,val:x.time});
    return {isShabbat,name:(row&&row.name)?row.name:"",erev:norm(erev),morning:norm(morning),afternoon:norm(afternoon),
            candle:candleVal,motzaei:motzaeiVal};
  }

  /* ---------- render each screen ---------- */
  function markPast(items,now,active){ if(!active) return items;
    return items.map(it=>{ const t=toToday(now,(it.val||"").trim()); return (t&&t<now)?{...it,past:true}:it; }); }

  function renderToday(now){
    // next prayer
    const list=CONFIG.tefillot||[];
    let np=nextUpcoming(now,list);
    if(!np){ const first=list.find(x=>/^\d{1,2}:\d{2}$/.test(x.time||"")); np=first?{name:first.name,time:first.time,t:null}:null; }
    const cd=np&&np.t?countdownText(np.t,now):"";
    $("nextPrayer").innerHTML = np
      ? `<div class="ne-label">התפילה הקרובה</div><div class="ne-name">${np.name}</div><div class="ne-time">${np.time||"—"}</div>${cd?`<div class="ne-count">${cd}</div>`:""}`
      : `<div class="ne-label">התפילה הקרובה</div><div class="ne-name">—</div>`;
    renderRows($("todayZmanim"),dailyZmanim(now));
    // next shiur
    const shiurList=getShiurim();
    const ns=nextUpcoming(now,shiurList.filter(s=>/^\d{1,2}:\d{2}$/.test(s.time||"")));
    const shiur=ns||shiurList[0];
    renderRows($("nextShiur"), shiur?[{name:shiur.name,hint:dayLabel(shiur.day),val:shiur.time||"",big:true}]:[]);
    // ticker
    const tm=CONFIG.tickerMessages||[]; $("ticker").innerHTML=tm.length?tm[Math.floor(Date.now()/15000)%tm.length]:"";
    // hide empty
    setHidden("nextShiurCard", shiurList.length===0);
    setHidden("ticker", tm.length===0);
  }

  function renderTefillot(now){
    renderRows($("tefRows"),(CONFIG.tefillot||[]).map(t=>({name:t.name,val:t.time,big:true})));
    renderRows($("shiurRows"),getShiurim().map(s=>({name:s.name,hint:dayLabel(s.day),val:s.time})));
    const dv=getDvar(now);
    $("tefDvar").innerHTML=dvarHtml(dv);
    const a=$("tefAnnounce"); a.innerHTML=""; getAnnouncements().forEach(x=>{const li=document.createElement("li");li.textContent=x;a.appendChild(li);});
    setHidden("tefShiurCard", getShiurim().length===0);
    setHidden("tefDvarCard", !(dv&&dv.text));
    setHidden("tefAnnounceCard", getAnnouncements().length===0);
  }

  function renderShabbatScreen(now){
    const d=shabbatData(now);
    const panel=$("screen-shabbat");
    panel.classList.toggle("panel--yomtov", !d.isShabbat);
    panel.classList.toggle("panel--shabbat", d.isShabbat);
    $("secErevTitle").textContent = d.isShabbat ? "ערב שבת" : (d.name||"החג");
    const active = (now.getDay()===6);
    renderRows($("shErev"),markPast(d.erev,now,active));
    renderRows($("shMorning"),markPast(d.morning,now,active));
    renderRows($("shAfternoon"),markPast(d.afternoon,now,active));
    // next event across all shabbat items
    const all=[...d.erev,...d.morning,...d.afternoon].filter(x=>/^\d{1,2}:\d{2}$/.test((x.val||"").trim()));
    let ne=null;
    if(active){ all.forEach(x=>{const t=toToday(now,x.val);if(t&&t>=now&&(!ne||t<ne.t))ne={name:x.name,val:x.val,t};}); }
    if(!ne) ne=all[0]?{name:all[0].name,val:all[0].val,t:null}:null;
    const cd=ne&&ne.t?countdownText(ne.t,now):"";
    $("shabbatNext").innerHTML = ne
      ? `<div class="ne-label">האירוע הבא</div><div class="ne-name">${ne.name}</div><div class="ne-time">${ne.val}</div>${cd?`<div class="ne-count">${cd}</div>`:""}`
      : `<div class="ne-label">${d.name||"שבת קודש"}</div>`;
  }

  function renderCommunity(now){
    const fill=(id,arr)=>{ const el=$(id); el.innerHTML=""; (arr||[]).forEach(x=>{const li=document.createElement("li");li.textContent=x;el.appendChild(li);}); };
    fill("commAnnounce",getAnnouncements());
    fill("commMazal",getMazal());
    const dv=getDvar(now); $("commDvar").innerHTML=dvarHtml(dv);
    setHidden("commAnnCard", getAnnouncements().length===0);
    setHidden("commMazalCard", getMazal().length===0);
    setHidden("commDvarCard", !(dv&&dv.text));
  }

  const RENDER={ today:renderToday, tefillot:renderTefillot, shabbat:renderShabbatScreen, community:renderCommunity };
  const SCREEN_EL={ today:"screen-today", tefillot:"screen-tefillot", shabbat:"screen-shabbat", community:"screen-community" };

  function showScreen(name){
    const now=new Date();
    (RENDER[name]||function(){})(now);
    Object.values(SCREEN_EL).forEach(id=>$(id).classList.remove("active"));
    const el=$(SCREEN_EL[name]); if(el) el.classList.add("active");
    requestAnimationFrame(()=>{ fitActive(); });
  }

  /* ---------- context-aware rotation ---------- */
  function dayType(now){
    const d=now.getDay(), h=now.getHours()+now.getMinutes()/60;
    if(d===6) return "shabbat";
    if(d===5 && h>=(Number(CONFIG.fridayFromHour)||12)) return "friday";
    return "weekday";
  }
  function screenHasContent(name){
    if(name==="community"){ const dv=getDvar(new Date()); return !!(getAnnouncements().length||getMazal().length||(dv&&dv.text)); }
    return true;   // today / tefillot / shabbat always have core data
  }
  let rotTimer=null, rotIdx=0, curMode=null;
  function rotate(){
    const now=new Date(); const mode=dayType(now);
    const seq=(CONFIG.screenRotationConfig&&CONFIG.screenRotationConfig[mode])||CONFIG.screenRotationConfig.weekday||[{screen:"today",sec:20}];
    if(mode!==curMode){ curMode=mode; rotIdx=0; }
    let item, tries=0;
    do{ item=seq[rotIdx%seq.length]; rotIdx++; tries++; } while(!screenHasContent(item.screen)&&tries<seq.length);
    showScreen(item.screen);
    clearTimeout(rotTimer); rotTimer=setTimeout(rotate,(item.sec||20)*1000);
  }

  /* ---------- per-second tick (clock + live countdown on active screen) ---------- */
  function tick(){
    const now=new Date(); renderHeader(now);
    const active=document.querySelector(".screen.active");
    if(active&&active.id==="screen-today") renderToday(now);
    else if(active&&active.id==="screen-shabbat") renderShabbatScreen(now);
    requestAnimationFrame(fitActive);
  }

  async function fullRefresh(){ await loadAll(); renderHeader(new Date()); if(curMode) rotate(); }

  function scheduleMidnight(){ const n=new Date(); const next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,30);
    setTimeout(()=>{ loadAll().then(()=>{ curMode=null; }); scheduleMidnight(); }, next-n); }

  if(!KZ){ $("todayZmanim").innerHTML='<div class="row"><span class="name">שגיאה בטעינת ספריית הזמנים</span></div>'; return; }

  loadAll().then(()=>{
    renderHeader(new Date());
    rotate();
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitActive);
  });
  setInterval(tick,1000);
  window.addEventListener("resize",()=>requestAnimationFrame(fitActive));
  scheduleMidnight();

  // periodic reload to pick up remote edits (fresh URL defeats webview cache)
  const rm=Number(CONFIG.autoReloadMinutes)||0;
  if(rm>0) setTimeout(()=>{ try{location.replace(location.origin+location.pathname+"?v="+Date.now());}catch(e){try{location.reload();}catch(_){}} }, rm*60*1000);
})();
</script>
