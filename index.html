<title>לוח זמנים</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800&display=swap');

  :root{
    --bg:#0f141b;
    --bg-2:#0b0f15;
    --panel:#171e28;
    --panel-2:#1c2531;
    --ink:#f4ede0;
    --muted:#98a3b3;
    --gold:#d9a441;
    --gold-bright:#eec06a;
    --gold-soft:rgba(217,164,65,.13);
    --line:rgba(244,237,224,.09);
    --line-strong:rgba(217,164,65,.35);
    --shabbat:#7fb2e0;
    --shabbat-soft:rgba(127,178,224,.12);
    --yomtov:#79c58c;
    --yomtov-soft:rgba(121,197,140,.12);
    --serif:'Frank Ruhl Libre', 'Times New Roman', serif;
    --sans:'Heebo', system-ui, sans-serif;
  }

  html,body{height:100%;overflow:hidden;}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, #1b2532 0%, var(--bg) 45%, var(--bg-2) 100%);
    color:var(--ink);
    font-family:var(--sans);
    direction:rtl;
    -webkit-font-smoothing:antialiased;
  }

  .board{
    height:100%;
    box-sizing:border-box;
    display:grid;
    grid-template-rows:auto auto 1fr auto;
    gap:clamp(12px,1.6vh,26px);
    padding:clamp(16px,2.4vh,34px) clamp(18px,2.4vw,44px);
    padding-block:clamp(16px,2.4vh,34px);
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:clamp(12px,2vw,40px);
    padding-bottom:clamp(10px,1.4vh,20px);
    border-bottom:1px solid var(--line);
  }
  .shul-name{
    font-family:var(--serif);
    font-weight:900;
    font-size:clamp(1.4rem,2.9vw,3rem);
    line-height:1.05;
    letter-spacing:.01em;
  }
  .shul-sub{
    color:var(--muted);
    font-weight:500;
    font-size:clamp(.75rem,1vw,1.05rem);
    margin-top:.25em;
  }
  .clock{
    font-family:var(--sans);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    font-size:clamp(2.6rem,6.4vw,7rem);
    line-height:.9;
    color:var(--gold-bright);
    text-shadow:0 0 34px rgba(217,164,65,.28);
    letter-spacing:.01em;
    text-align:center;
  }
  .dates{
    text-align:start;
    justify-self:start;
  }
  .hebrew-date{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(1.1rem,2.3vw,2.35rem);
    line-height:1.1;
    color:var(--ink);
  }
  .greg-date{
    color:var(--muted);
    font-weight:500;
    font-size:clamp(.75rem,1vw,1.05rem);
    margin-top:.3em;
    direction:rtl;
    text-align:start;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Parsha ribbon ---------- */
  .ribbon{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px,1.5vw,26px);
    padding:clamp(8px,1.2vh,16px) clamp(14px,2vw,30px);
    background:var(--gold-soft);
    border:1px solid var(--line-strong);
    border-radius:14px;
    flex-wrap:wrap;
  }
  .ribbon .lead{
    font-weight:500;
    color:var(--muted);
    font-size:clamp(.8rem,1.15vw,1.2rem);
    letter-spacing:.14em;
  }
  .ribbon .parsha{
    font-family:var(--serif);
    font-weight:700;
    color:var(--gold-bright);
    font-size:clamp(1.15rem,2.4vw,2.4rem);
  }
  .ribbon .tag{
    font-weight:700;
    color:var(--ink);
    font-size:clamp(.85rem,1.3vw,1.35rem);
    background:rgba(244,237,224,.07);
    border:1px solid var(--line);
    padding:.2em .8em;
    border-radius:999px;
  }
  .ribbon .tag[hidden]{display:none;}

  /* ---------- Columns ---------- */
  .cols{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(12px,1.6vw,26px);
    min-height:0;
  }
  .panel{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    padding:clamp(10px,1.3vh,20px) clamp(16px,1.6vw,30px);
    display:flex;
    flex-direction:column;
    min-height:0;
    box-shadow:0 18px 40px rgba(0,0,0,.28);
  }
  .panel-head{
    display:flex;
    align-items:baseline;
    gap:.6em;
    padding-bottom:clamp(8px,1.1vh,16px);
    margin-bottom:clamp(6px,1vh,14px);
    border-bottom:2px solid var(--line-strong);
  }
  .panel-title{
    font-family:var(--serif);
    font-weight:900;
    font-size:clamp(1.25rem,2.2vw,2.2rem);
    color:var(--gold);
  }
  .panel--shabbat .panel-title{color:var(--shabbat);}
  .panel--shabbat{border-color:var(--shabbat-soft);}
  .panel--shabbat .panel-head{border-bottom-color:rgba(127,178,224,.4);}
  .panel--yomtov .panel-title{color:var(--yomtov);}
  .panel--yomtov{border-color:var(--yomtov-soft);}
  .panel--yomtov .panel-head{border-bottom-color:rgba(121,197,140,.4);}
  .panel--yomtov .row .val{color:var(--yomtov);}
  .panel-note{
    color:var(--muted);
    font-size:clamp(.7rem,.95vw,1rem);
    font-weight:500;
  }

  .rows{
    --rs:1;                       /* auto-fit scale, set by JS to prevent clipping */
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    flex:1;
    gap:calc(clamp(1px,.3vh,5px) * var(--rs));
    min-height:0;
    overflow:hidden;
  }
  .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:.8em;
    padding:calc(clamp(1px,.35vh,6px) * var(--rs)) 0;
  }
  .row + .row{border-top:1px dotted var(--line);}
  .row .name{
    font-weight:500;
    font-size:calc(clamp(.85rem,1.45vw,1.5rem) * var(--rs));
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .name .hint{
    color:var(--muted);
    font-size:.7em;
    font-weight:400;
    margin-inline-start:.4em;
  }
  .row .val{
    font-weight:800;
    font-variant-numeric:tabular-nums;
    font-size:calc(clamp(.95rem,1.6vw,1.65rem) * var(--rs));
    color:var(--gold-bright);
    direction:ltr;
    letter-spacing:.02em;
  }
  .panel--shabbat .row .val{color:var(--shabbat);}
  .row--big .name{font-weight:700;}
  .row--big .val{font-size:calc(clamp(1.05rem,1.85vw,1.95rem) * var(--rs));}

  .footnote{
    color:var(--muted);
    font-size:clamp(.65rem,.85vw,.95rem);
    text-align:center;
    padding-top:.4em;
  }

  /* ---------- Bottom strip: shiurim + announcements ---------- */
  .strip{
    display:flex;
    align-items:center;
    gap:clamp(14px,2vw,34px);
    flex-wrap:wrap;
    padding:clamp(10px,1.4vh,18px) clamp(16px,1.8vw,30px);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 14px 34px rgba(0,0,0,.25);
  }
  .strip[hidden]{display:none;}
  .strip-block{display:flex;align-items:center;gap:clamp(8px,1vw,16px);min-width:0;}
  .strip-block[hidden]{display:none;}
  .strip-title{
    font-family:var(--serif);
    font-weight:900;
    color:var(--gold);
    font-size:clamp(1rem,1.7vw,1.6rem);
    white-space:nowrap;
  }
  .strip-ann{
    flex:1;
    min-width:200px;
    border-inline-start:1px solid var(--line);
    padding-inline-start:clamp(14px,2vw,28px);
  }
  .strip-ann .strip-title{color:var(--shabbat);}
  .chips{display:flex;gap:clamp(8px,1vw,14px);flex-wrap:wrap;}
  .chip{
    display:inline-flex;align-items:baseline;gap:.5em;
    background:var(--gold-soft);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:.3em .95em;
    font-size:clamp(.9rem,1.35vw,1.4rem);
    font-weight:500;
    white-space:nowrap;
  }
  .chip .c-time{font-weight:800;color:var(--gold-bright);font-variant-numeric:tabular-nums;direction:ltr;}
  .chip .c-day{color:var(--muted);font-size:.78em;}
  .ann-text{font-size:clamp(.95rem,1.5vw,1.5rem);font-weight:500;color:var(--ink);}

  @media (max-width:820px){
    .board{height:auto;min-height:100%;}
    header{grid-template-columns:1fr;justify-items:center;text-align:center;gap:10px;}
    .dates{justify-self:center;text-align:center;}
    .greg-date{text-align:center;}
    .cols{grid-template-columns:1fr;}
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/kosher-zmanim@0.9.0/dist/kosher-zmanim.min.js"></script>
<script>
(function(){
  const KZ = window.KosherZmanim;
  const $ = id => document.getElementById(id);

  // ---- static text from config ----
  $("shulName").textContent = CONFIG.shulName;
  $("shulSub").textContent  = CONFIG.shulSub;

  // ---- date helpers (tolerate Luxon | Temporal | Date) ----
  function toDate(x){
    if(!x) return null;
    if(x instanceof Date) return x;
    if(typeof x.toJSDate === "function") return x.toJSDate();            // Luxon
    if(typeof x.epochMilliseconds === "number") return new Date(x.epochMilliseconds); // Temporal
    if(typeof x.toMillis === "function") return new Date(x.toMillis());
    const d = new Date(x); return isNaN(d) ? null : d;
  }
  function plainDate(d){
    const T = KZ.Temporal;
    if(T && T.PlainDate) return T.PlainDate.from({year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()});
    return d; // Luxon/Date backends accept a JS Date
  }
  const fmtTime = d => d
    ? new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:CONFIG.timeZone}).format(d)
    : "—";

  // ---- build calendar for a given JS date ----
  function calFor(d){
    const geo = new KZ.GeoLocation(CONFIG.locationName, CONFIG.latitude, CONFIG.longitude, CONFIG.elevation, CONFIG.timeZone);
    const c = new KZ.ComplexZmanimCalendar(geo);
    try { c.setUseElevation(false); } catch(_){}   // sea-level zmanim, matching the Siddur app
    try { c.setDate(plainDate(d)); } catch(e){ try{ c.setDate(d); }catch(_){} }
    return c;
  }
  function jewishCalFor(d){
    let jc;
    try { jc = new KZ.JewishCalendar(plainDate(d)); }
    catch(e){ try { jc = new KZ.JewishCalendar(d); } catch(_){ jc = new KZ.JewishCalendar(); } }
    try { jc.setInIsrael(true); } catch(_){}   // Israel parsha/yom-tov schedule
    return jc;
  }

  function safe(fn){ try{ return toDate(fn()); }catch(e){ return null; } }

  // ---- times sheet (published Google-Sheets CSV, matched by Hebrew date) ----
  let SHEET = null; // Map: normalized Hebrew day+month -> row object
  const hebNorm = s => (s||"").replace(/[^א-ת]/g,"");
  function hebKeyFor(d){
    try{
      const hdf = new KZ.HebrewDateFormatter(); hdf.setHebrewFormat(true);
      const t = hdf.format(jewishCalFor(d)).trim().split(/\s+/);
      t.pop();                       // drop the year token, keep day + month
      return hebNorm(t.join(""));
    }catch(e){ return ""; }
  }
  function parseCSV(txt){
    const rows=[]; let f=[], cur="", q=false;
    for(let i=0;i<txt.length;i++){ const c=txt[i];
      if(q){ if(c=='"'){ if(txt[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c=='"') q=true;
        else if(c==',') { f.push(cur); cur=""; }
        else if(c=='\n'||c=='\r') { if(c=='\r'&&txt[i+1]=='\n') i++; f.push(cur); rows.push(f); f=[]; cur=""; }
        else cur+=c; } }
    if(cur.length||f.length){ f.push(cur); rows.push(f); }
    return rows;
  }
  async function loadSheet(){
    const url = CONFIG.timesSheetCsvUrl;
    if(!url){ SHEET = null; return; }
    try{
      const bust = (url.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();  // defeat webview cache
      const rows = parseCSV(await (await fetch(url + bust, {cache:"no-store"})).text());
      const m = new Map();
      // cols: 0 name,1 greg(unreliable),2 hebrew,3 candle,4 minchaErevShabbat,
      //       5 shkia,6 sofKS,7 shiur,8 minchaShabbat,9 motzaei,10 R"T(ignored)
      rows.slice(1).forEach(r => {
        const key = hebNorm(r[2]);
        if(!key) return;
        m.set(key, {
          name:(r[0]||"").trim(), candle:(r[3]||"").trim(), shkia:(r[5]||"").trim(),
          motzaei:(r[9]||"").trim(), minchaES:(r[4]||"").trim(),
          sofKS:(r[6]||"").trim(), shiur:(r[7]||"").trim(), minchaShabbat:(r[8]||"").trim(),
        });
      });
      SHEET = m.size ? m : null;
    }catch(e){ SHEET = null; }        // offline / blocked / bad data → computed fallback
  }
  function sheetRowForShabbat(now){
    return SHEET ? (SHEET.get(hebKeyFor(nextDow(now,6))) || null) : null;
  }
  // nearest upcoming sheet event from today (Shabbat OR a weekday Yom Tov), inclusive
  function nextEvent(now){
    if(!SHEET) return null;
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    for(let i=0;i<40;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const row = SHEET.get(hebKeyFor(d));
      if(row) return { date:d, row, isShabbat:d.getDay()===6 };
    }
    return null;
  }

  // ---- rows renderer ----
  function renderRows(container, items){
    container.innerHTML = "";
    items.filter(it => it && it.val).forEach(it => {
      const row = document.createElement("div");
      row.className = "row" + (it.big ? " row--big" : "");
      row.innerHTML =
        `<span class="name">${it.name}${it.hint?`<span class="hint">${it.hint}</span>`:""}</span>`+
        `<span class="val">${it.val}</span>`;
      container.appendChild(row);
    });
  }

  // shrink all three columns by one shared scale until none is clipped (uniform look, no scroll)
  function fitAll(){
    const els = ["minyanRows","zmanimRows","shabbatRows"].map(id => $(id)).filter(Boolean);
    const setRS = v => els.forEach(el => el.style.setProperty("--rs", v));
    const overflowing = () => els.some(el => el.scrollHeight > el.clientHeight + 1);
    setRS("1");
    let rs = 1, guard = 0;
    while(overflowing() && rs > 0.4 && guard < 30){ rs -= 0.05; setRS(rs.toFixed(2)); guard++; }
  }

  // ---- fixed minyan times (weekday) ----
  function renderMinyan(){
    renderRows($("minyanRows"),
      (CONFIG.minyanim.weekday||[]).map(m => ({name:m.name, val:m.time, big:true})));
  }

  // ---- daily zmanim ----
  function renderZmanim(now){
    const c = calFor(now);   // sea-level (isUseElevation=false), Siddur opinions below

    // derived values that aren't single library calls (match ZmanimService.kt)
    const chatz = safe(()=>c.getChatzos());
    const seaSunset = safe(()=>c.getSeaLevelSunset());
    const tzeis23 = seaSunset ? new Date(seaSunset.getTime() + 23*60000) : null;   // 3 stars, Israeli Sephardi
    let halfGra = null; try { halfGra = c.getShaahZmanisGra()/2; } catch(_){}
    const mgOffset = (halfGra!=null) ? Math.max(halfGra, 30*60000) : 30*60000;     // stricter of ½ shaah / 30 min
    const minchaGed = chatz ? new Date(chatz.getTime() + mgOffset) : null;

    const items = [
      {key:"alos",         name:"עלות השחר",            val:fmtTime(safe(()=>c.getAlos72()))},
      {key:"netz",         name:"הנץ החמה",             val:fmtTime(safe(()=>c.getSeaLevelSunrise()))},
      {key:"shmaMGA",      name:'סוף זמן ק"ש',  hint:'מג"א', val:fmtTime(safe(()=>c.getSofZmanShmaMGA72Minutes()))},
      {key:"shmaGRA",      name:'סוף זמן ק"ש',  hint:'הגר"א',val:fmtTime(safe(()=>c.getSofZmanShmaGRA())), big:true},
      {key:"tfilaGRA",     name:"סוף זמן תפילה", hint:'הגר"א',val:fmtTime(safe(()=>c.getSofZmanTfilaGRA()))},
      {key:"chatzos",      name:"חצות היום",           val:fmtTime(chatz)},
      {key:"minchaGedola", name:"מנחה גדולה",          val:fmtTime(minchaGed)},
      {key:"minchaKetana", name:"מנחה קטנה",          val:fmtTime(safe(()=>c.getMinchaKetana()))},
      {key:"plag",         name:"פלג המנחה",          val:fmtTime(safe(()=>c.getPlagHamincha()))},
      {key:"shkia",        name:"שקיעת החמה",         val:fmtTime(seaSunset)},
      {key:"tzais",        name:"צאת הכוכבים",        val:fmtTime(tzeis23)},
    ];

    // apply per-zman overrides/hides, then append any custom extra rows
    const ov = CONFIG.zmanimOverrides || {};
    let out = items
      .filter(it => ov[it.key] !== false)                       // false → hide row
      .map(it => (ov[it.key] ? {...it, val: ov[it.key]} : it));  // "HH:mm" → fixed value
    (CONFIG.extraDayRows || []).forEach(r => {
      if(r && r.name) out.push({name:r.name, hint:r.hint, val:r.time});
    });

    renderRows($("zmanimRows"), out);
  }

  // ---- bottom strip: shiurim + announcements ----
  function renderStrip(){
    const sh  = (CONFIG.shiurim || []).filter(s => s && s.name);
    const ann = (CONFIG.announcements || []).filter(Boolean);

    const shBlock = $("shiurimBlock"), annBlock = $("annBlock");
    if(sh.length){
      $("shiurimChips").innerHTML = sh.map(s =>
        `<span class="chip"><span class="c-name">${s.name}</span>` +
        (s.time ? `<span class="c-time">${s.time}</span>` : "") +
        (s.day  ? `<span class="c-day">${s.day}</span>`   : "") +
        `</span>`).join("");
      shBlock.hidden = false;
    } else shBlock.hidden = true;

    if(ann.length){
      $("annText").textContent = ann.join("   •   ");
      annBlock.hidden = false;
    } else annBlock.hidden = true;

    $("strip").hidden = !(sh.length || ann.length);
  }

  // ---- coming Shabbat ----
  function nextDow(base, dow){ // dow: 0=Sun..6=Sat
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    d.setDate(d.getDate() + ((dow - d.getDay() + 7) % 7));
    return d;
  }
  function renderShabbat(now){
    // nearest upcoming event: coming Shabbat, or an earlier weekday Yom Tov
    const ev = nextEvent(now);
    const isShabbat = ev ? ev.isShabbat : true;
    const evDate = ev ? ev.date : nextDow(now, 6);
    const row = ev ? ev.row : null;

    // computed fallbacks, based on the event's own eve/day
    const eve = new Date(evDate.getFullYear(), evDate.getMonth(), evDate.getDate()-1);
    const cEve = calFor(eve);
    const cDay = calFor(evDate);
    // computed fallback matches the Siddur (sea-level; candle = sunset − 20, motzaei = sunset + 31)
    let candle = safe(()=>cEve.getSunset());
    if(candle) candle = new Date(candle.getTime() - CONFIG.candleOffsetMinutes*60000);
    const daySunset = safe(()=>cDay.getSunset());
    const motzaei = daySunset ? new Date(daySunset.getTime() + 31*60000) : null;
    // ר"ת always computed (sheet's ר"ת column is inaccurate): sea-level sunset + 72 min
    const rt = daySunset ? new Date(daySunset.getTime() + 72*60000) : null;

    const candleVal  = (row && row.candle)  ? row.candle  : fmtTime(candle);
    const shkiaVal   = (row && row.shkia)   ? row.shkia   : fmtTime(safe(()=>cEve.getSunset()));
    const motzaeiVal = (row && row.motzaei) ? row.motzaei : fmtTime(motzaei);

    const items = [];
    if(isShabbat){
      (CONFIG.minyanim.shabbat||[]).forEach(m => items.push({name:m.name, val:m.time}));
    }
    items.push({name:"הדלקת נרות", val:candleVal, big:true});
    items.push({name:"שקיעה",      val:shkiaVal});
    items.push({name: isShabbat ? "מוצאי שבת" : "מוצאי החג", val:motzaeiVal, big:true});
    items.push({name: 'ר"ת', val: fmtTime(rt)});
    renderRows($("shabbatRows"), items);

    // panel title + subtitle
    let title, note;
    if(isShabbat){
      title = "שבת קודש";
      if(row && row.name){ note = row.name; }
      else {
        try { const hdf = new KZ.HebrewDateFormatter(); hdf.setHebrewFormat(true);
              const p = hdf.formatParsha(jewishCalFor(evDate)) || ""; note = p ? "פרשת "+p : ""; }
        catch(e){ note = ""; }
      }
    } else {
      title = (row && row.name) ? row.name : "חג";   // e.g. יום כיפור, חג פסח
      note  = "";
    }
    $("shabbatTitle").textContent = title;
    $("shabbatNote").textContent  = note || "";

    const panel = $("eventPanel");
    if(panel){
      panel.classList.toggle("panel--shabbat", isShabbat);
      panel.classList.toggle("panel--yomtov", !isShabbat);
    }
  }

  // ---- header dates + parsha ----
  function renderHeaderDates(now){
    $("clock").textContent = new Intl.DateTimeFormat("he-IL",
      {hour:"2-digit",minute:"2-digit",hour12:false,timeZone:CONFIG.timeZone}).format(now);

    $("gregDate").textContent = new Intl.DateTimeFormat("he-IL",
      {weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:CONFIG.timeZone}).format(now);

    try {
      const jc = jewishCalFor(now);
      const hdf = new KZ.HebrewDateFormatter();
      hdf.setHebrewFormat(true);
      $("hebrewDate").textContent = hdf.format(jc);

      // parsha of the coming Shabbat — prefer the sheet's name, else compute
      const row = sheetRowForShabbat(now);
      const p = (row && row.name) ? row.name : hdf.formatParsha(jewishCalFor(nextDow(now,6)));
      $("parsha").textContent = p && p.length ? p : "—";

      // special day (yom tov / rosh chodesh / fast) if the formatter offers it
      let special = "";
      try {
        if(typeof jc.isRoshChodesh === "function" && jc.isRoshChodesh()) special = "ראש חודש";
        const yt = hdf.formatYomTov ? hdf.formatYomTov(jc) : "";
        if(yt) special = yt;
      } catch(e){}
      const el = $("specialDay");
      if(special){ el.textContent = special; el.hidden = false; }
      else { el.hidden = true; }
    } catch(e){
      $("hebrewDate").textContent = "—";
    }
  }

  // ---- refresh cycles ----
  async function fullRefresh(){
    const now = new Date();
    await loadSheet();
    renderHeaderDates(now);
    renderMinyan();
    renderZmanim(now);
    renderShabbat(now);
    renderStrip();
    $("zmanimNote").textContent = CONFIG.locationName;
    requestAnimationFrame(fitAll);   // scale rows so nothing is clipped on this screen
  }
  function tickClock(){
    $("clock").textContent = new Intl.DateTimeFormat("he-IL",
      {hour:"2-digit",minute:"2-digit",hour12:false,timeZone:CONFIG.timeZone}).format(new Date());
  }

  function scheduleMidnight(){
    const n = new Date();
    const next = new Date(n.getFullYear(), n.getMonth(), n.getDate()+1, 0, 0, 30);
    setTimeout(()=>{ fullRefresh(); scheduleMidnight(); }, next - n);
  }

  if(!KZ){
    $("zmanimRows").innerHTML =
      '<div class="row"><span class="name">שגיאה בטעינת ספריית הזמנים</span></div>';
    return;
  }
  fullRefresh();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);  // re-fit once webfont loads
  window.addEventListener("resize", () => requestAnimationFrame(fitAll));
  setInterval(tickClock, 1000*15);
  scheduleMidnight();

  // rotate the three columns periodically so static text doesn't sit in one spot (anti burn-in)
  const sm = Number(CONFIG.panelSwapMinutes) || 0;
  if(sm > 0){
    const panels = [...document.querySelectorAll('.cols .panel')];
    // rotation derived from the clock, so it survives page reloads
    const apply = () => {
      const rot = Math.floor(Date.now() / (sm * 60 * 1000)) % panels.length;
      panels.forEach((p, i) => { p.style.order = (i + rot) % panels.length; });
    };
    apply();
    setInterval(apply, 10 * 1000);   // re-check often; visibly changes at each interval boundary
  }

  // reload from the server periodically so remote edits appear on the wall on their own
  const rm = Number(CONFIG.autoReloadMinutes) || 0;
  if(rm > 0){
    setTimeout(() => {
      // reload to a fresh URL (changing query) so the kiosk webview can't serve a cached page
      try { location.replace(location.origin + location.pathname + "?v=" + Date.now()); }
      catch(e){ try { location.reload(); } catch(_){} }
    }, rm * 60 * 1000);
  }
})();
</script>
